#==================================================
# CoreSales Backend
#==================================================
spring.application.name=service-customer

#==================================================
# SERVER
#==================================================
server.port=8080

#==================================================
# DATABASE
#==================================================
spring.datasource.url=jdbc:sqlserver://LAPTOP-U017LS9H;instanceName=SQLEXPRESS2022;databaseName=CoreSales;integratedSecurity=true;encrypt=true;trustServerCertificate=true
#spring.datasource.username=
#spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#==================================================
# JPA / HIBERNATE
#==================================================
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#==================================================
# JSON
#==================================================
spring.jackson.default-property-inclusion=non_null

#==================================================
# JWT Config
#==================================================
app.jwt.secret = ${JWT_SECRET}
app.jwt.expiration = 600000
#600000 == 10 minutos en milisegundos