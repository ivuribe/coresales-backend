global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ==================================================
  # PROMETHEUS
  # ==================================================
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # ==================================================
  # API GATEWAY
  # ==================================================
  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8080"

  # ==================================================
  # SERVICE CUSTOMER
  # ==================================================
  - job_name: "service-customer"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8082"

  # ==================================================
  # SERVICE PRODUCT
  # ==================================================
  - job_name: "service-product"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8083"