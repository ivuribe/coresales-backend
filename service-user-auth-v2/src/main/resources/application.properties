#==================================================
# CoreSales Backend
#==================================================
spring.application.name=service-user-auth

#==================================================
# SERVER
#==================================================
server.port=8081

#==================================================
# DATABASE
#==================================================
#spring.datasource.url=jdbc:sqlserver://LAPTOP-U017LS9H;instanceName=SQLEXPRESS2022;databaseName=CoreSales;integratedSecurity=true;encrypt=true;trustServerCertificate=true
spring.datasource.url=jdbc:sqlserver://host.docker.internal:59890;instanceName=SQLEXPRESS2022;databaseName=CoreSales;integratedSecurity=true;encrypt=true;trustServerCertificate=true
#spring.datasource.username=
#spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#==================================================
# JPA / HIBERNATE
#==================================================
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#==================================================
# JSON
#==================================================
#Indica que los atributos cuyo valor sea null no se incluiran en el JSON de respuesta:
spring.jackson.default-property-inclusion=non_null

#==================================================
# SECURITY OAUTH 2.0
#==================================================
#spring.security.oauth2.authorizationserver.issuer=http://localhost:8081
spring.security.oauth2.authorizationserver.issuer=http://auth.coresales.local:8081